name: Bootstrap COM11H Shop Signing

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK not found at $ANDROID_HOME"; exit 1; }
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Android 35 SDK components are missing; installing them..."
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK platform 35 and build-tools 35.0.0 are ready."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate release keystore
        id: signing
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="com11h_shop"
          KEY_PASSWORD="$KEYSTORE_PASSWORD"

          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=COM11H Shop, OU=COM11H, O=COM11H, L=Vietnam, ST=Vietnam, C=VN"

          KEYSTORE_BASE64="$(base64 -w 0 app/release.keystore)"

          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEYSTORE_BASE64=$KEYSTORE_BASE64"
          } > signing-secrets.txt

          echo "A new release key was generated. Keep the uploaded signing-secrets.txt private."

      - name: Build signed release APK with generated key
        run: |
          set -euo pipefail

          # The generated values are intentionally read from the file only for this job.
          KEYSTORE_PASSWORD="$(grep '^KEYSTORE_PASSWORD=' signing-secrets.txt | cut -d= -f2-)"
          KEY_ALIAS="$(grep '^KEY_ALIAS=' signing-secrets.txt | cut -d= -f2-)"
          KEY_PASSWORD="$(grep '^KEY_PASSWORD=' signing-secrets.txt | cut -d= -f2-)"
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD

          gradle :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare signing bundle
        run: |
          set -euo pipefail
          cp signing-secrets.txt com11h-shop-signing-secrets.txt
          cp app/release.keystore com11h-shop-release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: com11h-shop-bootstrap-signing
          path: |
            app/build/outputs/apk/release/app-release.apk
            com11h-shop-release.keystore
            com11h-shop-signing-secrets.txt
          retention-days: 1
