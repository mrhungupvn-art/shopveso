name: Android Shop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK not found at $ANDROID_HOME"; exit 1; }
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Android 35 SDK components are missing; installing them..."
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK platform 35 and build-tools 35.0.0 are ready."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: Missing GitHub Actions secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "The release APK is intentionally NOT built without a signing key."
            echo "Run the 'Bootstrap COM11H Shop Signing' workflow once, then add the generated values to:"
            echo "Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore

          keytool -list \
            -keystore app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Release keystore and alias verified."

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Expected signed APK not found: $APK"
            echo "Build output directory:"
            find app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi

          if [[ "$APK" == *unsigned.apk ]]; then
            echo "ERROR: Refusing to upload an unsigned APK."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "Signed APK verification passed."

      - uses: actions/upload-artifact@v4
        with:
          name: com11h-shop-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
